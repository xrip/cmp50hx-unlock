name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------
  # Linux: build the EFI binary, wrap it with the ESP-deploy installer
  # into a self-extracting .run. No kernel-module build here: a module
  # compiled against the runner's kernel would not load on user hosts;
  # users who want the patched module run install.sh from the repo.
  # -------------------------------------------------------------------
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the EFI binary
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gnu-efi
          cd efi-unlock
          bash ./build.sh
          sha256sum 50HXUNLK.EFI | tee 50HXUNLK.EFI.sha256

      - name: Compose the Linux payload
        run: |
          set -eux
          STAGE="$PWD/.stage-linux"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp efi-unlock/50HXUNLK.EFI "$STAGE/"
          cp efi-unlock/50HXUNLK.EFI.sha256 "$STAGE/"
          cp efi-unlock/install-linux.sh "$STAGE/install.sh"
          cp efi-unlock/README.md "$STAGE/README.md"
          tar -C "$STAGE" -czf cmp50hx-unlock-linux.tar.gz .
          sha256sum cmp50hx-unlock-linux.tar.gz > cmp50hx-unlock-linux.tar.gz.sha256

      - name: Build the self-extracting installer (.run)
        run: |
          set -eux
          CMP_VERSION="${GITHUB_REF_NAME:-dev}" \
          CMP_RELEASE_URL="https://github.com/${{ github.repository }}/releases/latest/download/cmp50hx-unlock-linux.tar.gz" \
            bash tools/build-linux-installer.sh \
              --tar cmp50hx-unlock-linux.tar.gz \
              --out cmp50hx-unlock-linux.run

      - name: Smoke-test the .run (real extraction + checksum)
        run: |
          set -eux
          ./cmp50hx-unlock-linux.run --self-check
          # extract the embedded payload for real and verify integrity
          D="$(mktemp -d)"
          ./cmp50hx-unlock-linux.run --use-embedded --unpack-only --workdir "$D"
          sha256sum "$D/payload.tar.gz"
          diff <(sha256sum < "$D/payload.tar.gz" | cut -d' ' -f1) \
               <(cut -d' ' -f1 cmp50hx-unlock-linux.tar.gz.sha256)
          tar -tzf "$D/payload.tar.gz" | grep -x 'install.sh'
          tar -tzf "$D/payload.tar.gz" | grep -x '50HXUNLK.EFI'
          rm -rf "$D"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmp50hx-unlock-linux
          path: |
            cmp50hx-unlock-linux.run
            cmp50hx-unlock-linux.tar.gz
            cmp50hx-unlock-linux.tar.gz.sha256

  # -------------------------------------------------------------------
  # Windows: build the three Go tools (they embed the EFI binary from
  # efi-unlock-windows/tools/inst50hx/embed/) and bundle the BYOVD
  # Gen2 runtime into a ZIP.
  # -------------------------------------------------------------------
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build the Go tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Note: the checkout lives at $env:GITHUB_WORKSPACE, whose path
          # ends in \<repo>\<repo> — that is the standard Actions layout.
          $W = $env:GITHUB_WORKSPACE
          $Tools = Join-Path $W 'efi-unlock-windows\tools'
          $Stage = Join-Path $W 'artifacts\windows-stage'
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null
          foreach ($d in @('winres_gen','inst50hx','uninstall50x','check50x')) {
              if (-not (Test-Path (Join-Path $Tools $d))) {
                  throw "missing tool dir: $(Join-Path $Tools $d)"
              }
          }
          # winres_gen generates the .syso once (skipped if already present)
          if (-not (Test-Path (Join-Path $Tools 'inst50hx\rsrc_windows_amd64.syso'))) {
              Push-Location (Join-Path $Tools 'winres_gen')
              try { go build -o (Join-Path $Stage 'winres_gen.exe') . }
              finally { Pop-Location }
              & (Join-Path $Stage 'winres_gen.exe') -o (Join-Path $Tools 'inst50hx\rsrc_windows_amd64.syso')
          }
          foreach ($t in @(
              @{ Name = '50HXInstaller.exe';   Dir = 'inst50hx' },
              @{ Name = '50HXUninstaller.exe'; Dir = 'uninstall50x' },
              @{ Name = '50HXCheck.exe';       Dir = 'check50x' }
          )) {
              Push-Location (Join-Path $Tools $t.Dir)
              try { go build -a -trimpath -ldflags='-H=windowsgui -s -w' -o (Join-Path $Stage $t.Name) . }
              finally { Pop-Location }
          }
          # payload pieces
          Copy-Item -Recurse -Force (Join-Path $W 'efi-unlock-windows\gen2\*') $Stage
          Copy-Item -Force (Join-Path $W 'efi-unlock-windows\README.md') (Join-Path $Stage 'README.md')
          Copy-Item -Force (Join-Path $Tools 'inst50hx\embed\50HXUNLK.EFI') (Join-Path $Stage '50HXUNLK.EFI')
          Get-ChildItem $Stage | Format-Table Name,Length
          (Get-FileHash (Join-Path $Stage '50HXInstaller.exe') -Algorithm SHA256).Hash

      - name: Compose the Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Zip = Join-Path $env:GITHUB_WORKSPACE 'cmp50hx-unlock-windows.zip'
          if (Test-Path $Zip) { Remove-Item $Zip }
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'artifacts\windows-stage\*') `
                           -DestinationPath $Zip -CompressionLevel Optimal
          "$((Get-FileHash $Zip -Algorithm SHA256).Hash)  cmp50hx-unlock-windows.zip" |
            Set-Content -NoNewline (Join-Path $env:GITHUB_WORKSPACE 'cmp50hx-unlock-windows.zip.sha256')

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmp50hx-unlock-windows
          path: |
            cmp50hx-unlock-windows.zip
            cmp50hx-unlock-windows.zip.sha256

  # -------------------------------------------------------------------
  # Publish the release (tag pushes only)
  # -------------------------------------------------------------------
  release:
    needs: [linux, windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cmp50hx-unlock-linux
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: cmp50hx-unlock-windows
          path: dist/windows

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "CMP 50HX unlock ${{ github.ref_name }}"
          body: |
            One-click installer for the CMP 50HX (TU102, 10de:1e09):

            **Linux** — download `cmp50hx-unlock-linux.run`, then:
            ```bash
            chmod +x cmp50hx-unlock-linux.run
            sudo ./cmp50hx-unlock-linux.run
            ```

            **Windows** — download `cmp50hx-unlock-windows.zip`, unzip, then:
            right-click `50HXInstaller.exe` → *Run as administrator* → *Install*

            Both ship the same UEFI compute unlock (FP32 31.7x / DP4A 28.4x
            over the locked stock driver, zero Xid; A/B matrix:
            efi-unlock/runs/20260910-ab-stock-vs-efi.md). Requires UEFI boot
            with Above 4G Decoding on and Secure Boot off.
          files: |
            dist/linux/cmp50hx-unlock-linux.run
            dist/linux/cmp50hx-unlock-linux.tar.gz
            dist/linux/cmp50hx-unlock-linux.tar.gz.sha256
            dist/windows/cmp50hx-unlock-windows.zip
            dist/windows/cmp50hx-unlock-windows.zip.sha256
          fail_on_unmatched_files: true
