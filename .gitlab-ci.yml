# GitLab CI — mirrors .github/workflows/release.yml.
#
# Produces the same two one-click artifacts on tag pipelines:
#   - cmp50hx-unlock-linux.run   (self-extracting ESP-deploy installer)
#   - cmp50hx-unlock-windows.zip (Go installer tools + EFI + Gen2 runtime)
# and publishes them as a GitLab Release.
#
# Runner requirements: ordinary Linux docker runners only. The Windows Go
# tools are cross-compiled from Linux (GOOS=windows); the EFI binary they
# embed is committed at efi-unlock-windows/tools/inst50hx/embed/, and the
# windows manifest .syso is committed beside the sources, so no Windows
# runner is needed. On tag pipelines the binaries are uploaded to the
# project's Generic Package Registry (permanent URLs) and linked from a
# Release — see the release job.

stages: [build, package, release]

workflow:
  rules:
    # release publishing happens on tags; build+package also run on the
    # default branch so MRs and main stay verified
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

variables:
  DEBIAN_FRONTEND: noninteractive

# -------------------------------------------------------------------
# build: EFI binary (same recipe as the GitHub linux job)
# -------------------------------------------------------------------
build:linux-efi:
  stage: build
  image: ubuntu:24.04
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends build-essential gnu-efi
  script:
    - cd efi-unlock
    - bash ./build.sh
    - sha256sum 50HXUNLK.EFI | tee 50HXUNLK.EFI.sha256
  artifacts:
    paths:
      - efi-unlock/50HXUNLK.EFI
      - efi-unlock/50HXUNLK.EFI.sha256
    expire_in: 1 week

# -------------------------------------------------------------------
# package: Linux payload + self-extracting .run (with smoke test)
# -------------------------------------------------------------------
package:linux:
  stage: package
  image: ubuntu:24.04
  needs: [build:linux-efi]
  script:
    - |
      set -eux
      STAGE="$PWD/.stage-linux"
      rm -rf "$STAGE" && mkdir -p "$STAGE"
      cp efi-unlock/50HXUNLK.EFI "$STAGE/"
      cp efi-unlock/50HXUNLK.EFI.sha256 "$STAGE/"
      cp efi-unlock/install-linux.sh "$STAGE/install.sh"
      cp efi-unlock/README.md "$STAGE/README.md"
      tar -C "$STAGE" -czf cmp50hx-unlock-linux.tar.gz .
      sha256sum cmp50hx-unlock-linux.tar.gz > cmp50hx-unlock-linux.tar.gz.sha256
    - |
      set -eux
      CMP_VERSION="${CI_COMMIT_TAG:-dev}" \
      CMP_RELEASE_URL="${CI_PROJECT_URL}/-/releases/${CI_COMMIT_TAG}/downloads/cmp50hx-unlock-linux.tar.gz" \
        bash tools/build-linux-installer.sh \
          --tar cmp50hx-unlock-linux.tar.gz \
          --out cmp50hx-unlock-linux.run
    # smoke test: real extraction of the embedded payload + checksum
    - |
      set -eux
      ./cmp50hx-unlock-linux.run --self-check
      D="$(mktemp -d)"
      ./cmp50hx-unlock-linux.run --use-embedded --unpack-only --workdir "$D"
      diff <(sha256sum < "$D/payload.tar.gz" | cut -d' ' -f1) \
           <(cut -d' ' -f1 cmp50hx-unlock-linux.tar.gz.sha256)
      tar -tzf "$D/payload.tar.gz" | grep -x './install.sh'
      tar -tzf "$D/payload.tar.gz" | grep -x './50HXUNLK.EFI'
      rm -rf "$D"
  artifacts:
    paths:
      - cmp50hx-unlock-linux.run
      - cmp50hx-unlock-linux.tar.gz
      - cmp50hx-unlock-linux.tar.gz.sha256
    expire_in: 1 week

# -------------------------------------------------------------------
# package: Windows ZIP (Go tools cross-compiled from Linux)
# -------------------------------------------------------------------
package:windows:
  stage: package
  image: golang:1.23-bookworm
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends zip
  script:
    - |
      set -eux
      export GOOS=windows GOARCH=amd64 CGO_ENABLED=0
      TOOLS=efi-unlock-windows/tools
      STAGE="$PWD/.stage-windows"
      mkdir -p "$STAGE"
      # the committed manifest .syso is picked up automatically next to
      # the sources; no winres_gen step is needed on CI
      ( cd "$TOOLS/winres_gen"     && go build -trimpath -o "$STAGE/winres_gen.exe" . )
      ( cd "$TOOLS/inst50hx"       && go build -trimpath -ldflags='-H=windowsgui -s -w' -o "$STAGE/50HXInstaller.exe" . )
      ( cd "$TOOLS/uninstall50x"   && go build -trimpath -ldflags='-H=windowsgui -s -w' -o "$STAGE/50HXUninstaller.exe" . )
      ( cd "$TOOLS/check50x"       && go build -trimpath -ldflags='-H=windowsgui -s -w' -o "$STAGE/50HXCheck.exe" . )
      cp "$TOOLS/inst50hx/embed/50HXUNLK.EFI" "$STAGE/50HXUNLK.EFI"
      cp efi-unlock-windows/README.md "$STAGE/README.md"
      cp -r efi-unlock-windows/gen2/. "$STAGE/"
      ( cd "$STAGE" && zip -q -r "$PWD/cmp50hx-unlock-windows.zip" . )
      sha256sum cmp50hx-unlock-windows.zip > cmp50hx-unlock-windows.zip.sha256
      ( cd "$STAGE" && unzip -l "$PWD/cmp50hx-unlock-windows.zip" | tail -20 )
  artifacts:
    paths:
      - cmp50hx-unlock-windows.zip
      - cmp50hx-unlock-windows.zip.sha256
    expire_in: 1 week

# -------------------------------------------------------------------
# release: upload artifacts to the Generic Package Registry (permanent
# URLs, independent of job artifact expiry) and create the Release
# -------------------------------------------------------------------
release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs: [package:linux, package:windows]
  script:
    - |
      set -eux
      PKG_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cmp50hx-unlock/${CI_COMMIT_TAG}"
      for f in cmp50hx-unlock-linux.run \
               cmp50hx-unlock-linux.tar.gz \
               cmp50hx-unlock-linux.tar.gz.sha256 \
               cmp50hx-unlock-windows.zip \
               cmp50hx-unlock-windows.zip.sha256; do
        curl --fail --show-error --retry 3 \
             --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "$f" "${PKG_URL}/$f"
        echo "uploaded: $f"
      done
    - |
      release-cli create \
        --name "CMP 50HX unlock ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "One-click installer for the CMP 50HX (TU102, 10de:1e09).

      Linux — download cmp50hx-unlock-linux.run, then:
          chmod +x cmp50hx-unlock-linux.run && sudo ./cmp50hx-unlock-linux.run

      Windows — download cmp50hx-unlock-windows.zip, unzip, then:
          right-click 50HXInstaller.exe -> Run as administrator -> Install

      Both ship the same UEFI compute unlock (FP32 31.7x / DP4A 28.4x over
      the locked stock driver, zero Xid; A/B matrix:
      efi-unlock/runs/20260910-ab-stock-vs-efi.md). Requires UEFI boot with
      Above 4G Decoding on and Secure Boot off." \
        --assets-link "{\"name\":\"cmp50hx-unlock-linux.run\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cmp50hx-unlock/${CI_COMMIT_TAG}/cmp50hx-unlock-linux.run\"}" \
        --assets-link "{\"name\":\"cmp50hx-unlock-linux.tar.gz\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cmp50hx-unlock/${CI_COMMIT_TAG}/cmp50hx-unlock-linux.tar.gz\"}" \
        --assets-link "{\"name\":\"cmp50hx-unlock-linux.tar.gz.sha256\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cmp50hx-unlock/${CI_COMMIT_TAG}/cmp50hx-unlock-linux.tar.gz.sha256\"}" \
        --assets-link "{\"name\":\"cmp50hx-unlock-windows.zip\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cmp50hx-unlock/${CI_COMMIT_TAG}/cmp50hx-unlock-windows.zip\"}" \
        --assets-link "{\"name\":\"cmp50hx-unlock-windows.zip.sha256\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/cmp50hx-unlock/${CI_COMMIT_TAG}/cmp50hx-unlock-windows.zip.sha256\"}"
